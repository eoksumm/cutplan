[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutplan-core"
version = "0.1.0"
description = "A small, reusable library for planning sheet-material cutting layouts: parts, sheet arrangement and cost estimation."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cutplan_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
