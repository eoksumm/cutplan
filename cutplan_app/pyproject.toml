[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutplan-app"
version = "0.1.0"
description = "CutPlan desktop app - a Tkinter GUI built on top of the cutplan-core library."
requires-python = ">=3.9"
dependencies = ["cutplan-core"]

[project.scripts]
cutplan = "cutplan_app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cutplan_app*"]
